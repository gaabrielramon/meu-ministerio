<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ministério">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>window.__PWA__ = true; window.__APP_VERSION__ = 7;</script>
<title>Meu Ministério</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F5F0; --surface:#FFFFFF; --sunk:#E9EDE6; --line:#D7DDD3;
  --ink:#1C2420; --muted:#5F6B64; --accent:#2F6B4F; --accent-ink:#FFFFFF;
  --accent-soft:#DCEBE1; --amber:#A8661A; --amber-soft:#F6E8D3; --danger:#B3403A; --danger-soft:#F6DEDB;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111513; --surface:#19201C; --sunk:#222A25; --line:#2E3832;
    --ink:#E7ECE8; --muted:#9BA69F; --accent:#6DBE8F; --accent-ink:#0E1511;
    --accent-soft:#223A2D; --amber:#E0A458; --amber-soft:#3A2D1B; --danger:#E0827B; --danger-soft:#3D2220;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111513; --surface:#19201C; --sunk:#222A25; --line:#2E3832;
  --ink:#E7ECE8; --muted:#9BA69F; --accent:#6DBE8F; --accent-ink:#0E1511;
  --accent-soft:#223A2D; --amber:#E0A458; --amber-soft:#3A2D1B; --danger:#E0827B; --danger-soft:#3D2220;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{color:var(--ink);font:1rem/1.5 var(--body);padding-inline:16px;padding-block:0 calc(5.75rem + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:20px}
h1{font:700 1.6rem/1.1 var(--display);letter-spacing:-.01em;margin:0}
h2{font:700 1.15rem/1.2 var(--display);margin:0;text-wrap:balance}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:999px;white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--danger-soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* Timer */
.timer{align-items:center;text-align:center;padding-block:26px}
.clock{font:500 clamp(2.8rem,14vw,4.2rem)/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.clock.running{color:var(--accent)}
.status{font-size:.9rem;color:var(--muted);min-height:1.4em}
.timer .row{justify-content:center}
.timer .row{width:100%;flex-wrap:nowrap}
.timer .btn{flex:1;max-width:200px;padding:12px 14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

/* Progress */
.big{font:700 2.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font:600 1rem var(--body);color:var(--muted);margin-left:4px}
.bar{height:12px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s}
.bar.done i{background:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--sunk);border-radius:10px;padding:10px}
.fact b{display:block;font:700 1.05rem var(--display);font-variant-numeric:tabular-nums}
.fact span{font-size:.75rem;color:var(--muted)}
@media (max-width:380px){.facts{grid-template-columns:1fr 1fr}}

/* Forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-size:1rem;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3 .span{grid-column:1/-1}}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

/* Types */
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.type b{font:700 1rem var(--display)}
.type span{font-size:.8rem;color:var(--muted)}
.type[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:360px){.types{grid-template-columns:1fr}}

/* Month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav h2::first-letter{text-transform:uppercase}
#app{display:flex;flex-direction:column;gap:16px}
.iconbtn{width:2.5rem;height:2.5rem;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;line-height:1;display:grid;place-items:center}

/* Entries */
.entries{display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.day{width:4rem;text-align:center;background:var(--sunk);border-radius:10px;padding:6px 0;line-height:1.1}
.day b{display:block;font:700 1.15rem var(--display)}
.day span{font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.entry .dur{font:600 1rem var(--mono);font-variant-numeric:tabular-nums}
.entry .note{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--amber);background:var(--amber-soft);padding:2px 6px;border-radius:6px;margin-left:6px}
.del{border:0;background:transparent;color:var(--muted);padding:6px 8px;border-radius:8px;font-size:.85rem}
.del.armed{background:var(--danger-soft);color:var(--danger);font-weight:600}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--sunk);border-radius:10px;font-size:.95rem}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .d{border:1px solid transparent;background:var(--sunk);border-radius:8px;min-height:3.25rem;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;font-variant-numeric:tabular-nums;min-width:0}
.cal .d b{font:600 .9rem var(--body)}
.cal .d span{font:500 .68rem var(--mono);color:var(--accent);white-space:nowrap}
.cal .d.has{background:var(--accent-soft)}
.cal .d.today{border-color:var(--accent)}
.cal .d.sel{background:var(--accent);color:var(--accent-ink)}
.cal .d.sel span{color:var(--accent-ink)}
.cal .d.future{opacity:.45}
.cal .pad{min-height:3.25rem}
.daydetail{background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.daydetail b{font:700 1rem var(--display)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper output{font:700 1.4rem var(--display);min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* Report slip */
.slip{background:var(--ground);border:1px dashed var(--line);border-radius:10px;padding:14px;font:400 .92rem/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}

/* Year chart */
.chart{display:grid;grid-template-columns:repeat(12,minmax(1.9rem,1fr));gap:6px;align-items:end;height:170px;position:relative;padding-top:8px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.chart .b{width:100%;max-width:28px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.chart .b.under{background:var(--amber)}
.chart .b.zero{background:var(--line)}
.chart .b.future{background:var(--sunk)}
.chart .lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase}
.chart .val{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6;pointer-events:none}
.goal-line span{position:absolute;right:0;top:-18px;font-size:.68rem;color:var(--muted);background:var(--surface);padding:0 4px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Avatar */
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 1rem var(--display);overflow:hidden;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.lgish{width:52px;height:52px;font-size:1.15rem}
.avatar.lg{width:96px;height:96px;font-size:2rem}
.photo-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.photo-row .row{gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
/* Theme picker */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;line-height:1.2;text-align:center;overflow-wrap:anywhere;font-weight:600;color:var(--muted);position:relative;overflow:hidden}
.sw i{width:30px;height:30px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.sw[aria-pressed=true]{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.sw input[type=color]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.seg.sizes{display:grid;grid-template-columns:repeat(3,1fr)}
.editor{border:1.5px solid var(--accent);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.editor .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dayentries{display:flex;flex-direction:column;gap:8px}
.dayentry{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dayentry .note{font-size:.85rem;color:var(--muted);overflow-wrap:anywhere}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 8px;border-radius:8px;font-size:.9rem}
.sizes button{display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.sizes button b{font-family:var(--display)}
.preview{background:var(--sunk);border-radius:10px;padding:12px 14px}
/* People */
.plist{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard h3{margin:0;font:700 1.1rem/1.2 var(--display);overflow-wrap:anywhere}
.pline{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;overflow-wrap:anywhere}
.pline svg{width:1.05rem;height:1.05rem;flex:none;margin-top:.2rem;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pnotes{font-size:.88rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.pill{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
.pill.today{background:var(--amber-soft);color:var(--amber)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pactions{display:flex;gap:4px;flex-wrap:wrap;margin-left:-8px}
.since{font:700 1.35rem/1.1 var(--display);color:var(--accent)}
textarea{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;font:inherit;font-size:1rem;color:var(--ink);resize:vertical;min-height:4.5rem}
.maplink{display:block;color:var(--accent);font-weight:700;font-size:.85rem;margin-top:2px}
a.addrlink{color:var(--ink);text-decoration:none;background:var(--sunk);border-radius:10px;padding:10px 12px;margin-inline:-2px}
a.addrlink:active{background:var(--accent-soft)}
a.addrlink .addrtxt{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
a.addrlink svg{stroke:var(--accent)}
.hint{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 12px;font-size:.88rem}
.banner{background:var(--amber-soft);color:var(--ink);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* Bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:10}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:560px}
nav.tabs button{border:0;background:transparent;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:1.4rem;height:1.4rem;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft)}

.toast{position:fixed;left:50%;bottom:calc(5.9rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.9rem;z-index:20;max-width:calc(100% - 32px);text-align:center}
.sync{font-size:.75rem;color:var(--muted)}
</style>
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" id="hello">Ministério de campo</div>
      <h1>Meu Ministério</h1>
      <span class="chip" id="typeChip" style="margin-top:8px">Pioneiro auxiliar</span>
    </div>
    <button class="avatar lgish" id="topAvatar" data-go="ajustes" aria-label="Abrir perfil"></button>
  </header>
  <main id="app"></main>
  <p class="sync" id="sync">Carregando seus dados…</p>
</div>

<nav class="tabs" aria-label="Seções">
  <div class="in">
    <button data-tab="contador"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Contador</button>
    <button data-tab="mes"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês</button>
    <button data-tab="pessoas"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.5-5.5 6.5-5.5s5.5 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.8"/><path d="M16.5 14.6c2.6.1 4.4 1.8 5.2 4.6"/></svg>Pessoas</button>
    <button data-tab="ano"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Ano</button>
    <button data-tab="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
  </div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';

const TYPES = {
  publicador:{label:'Publicador', desc:'Relata participação e estudos', month:0, year:0},
  auxiliar:{label:'Pioneiro auxiliar', desc:'30 ou 15 horas por mês', month:30, year:0},
  regular:{label:'Pioneiro regular', desc:'Meta mensal e anual', month:50, year:600},
  especial:{label:'Pioneiro especial', desc:'Meta mensal de horas', month:130, year:0},
};
const IS_PWA = !!window.__PWA__;
const MONTHS_SHORT = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEK = ['dom','seg','ter','qua','qui','sex','sáb'];
const WEEK_FULL = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthKeyOf = iso => iso.slice(0,7);
const curMonthKey = () => monthKeyOf(todayISO());
const addMonths = (key, n) => { let [y,m]=key.split('-').map(Number); m+=n; while(m>12){m-=12;y++} while(m<1){m+=12;y--} return `${y}-${pad(m)}`; };
const monthName = key => { const [y,m]=key.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); };
const serviceYearStart = key => { const [y,m]=key.split('-').map(Number); return m>=9 ? y : y-1; };
const fmtHM = min => { min=Math.max(0,Math.round(min)); const h=Math.floor(min/60), m=min%60; return m ? `${h}h${pad(m)}` : `${h}h`; };
const fmtClock = ms => { const s=Math.floor(ms/1000); return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }

/* ---------- state ---------- */
const defaultProfile = () => ({ name:'', photo:'', accent:'', mode:'auto', fontSize:'normal', type:'auxiliar', goalMonth:30, goalYear:0, configured:false,
  timer:{ running:false, startedAt:null, accumMs:0 } });
const emptyMonth = () => ({ entries:[], studies:0, participated:null });

const state = {
  profile: defaultProfile(),
  months: {},
  tab: 'contador',
  cursor: curMonthKey(),
  yearStart: serviceYearStart(curMonthKey()),
  draft: { date: todayISO(), h:'', m:'', kind:'campo', note:'' },
  armed: null,
  selDay: null,
  pendingImport: null,
  editing: null,
  people: { revisits:[], students:[] },
  pview: 'rev',
  pform: null,
};
const month = key => state.months[key] || emptyMonth();

/* ---------- storage: db per viewer, local fallback ---------- */
const LS = 'meu-ministerio-v1';
const local = {
  read(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } },
  write(){ try{ localStorage.setItem(LS, JSON.stringify({profile:state.profile, months:state.months, people:state.people})); }catch(e){} },
};
let remote = null;      // { profileRef, monthsCol }
const chains = {};
function enqueue(key, fn){
  chains[key] = (chains[key]||Promise.resolve()).then(fn).catch(e=>{ console.warn(e); toast('Não foi possível salvar agora. Tente de novo.'); });
  return chains[key];
}
function persistProfile(){
  local.write();
  if(remote) enqueue('profile', ()=>remote.profileRef.set(clone(state.profile)));
}
let profileTimer=null, profileDirty=false;
function persistProfileSoon(){
  profileDirty=true; clearTimeout(profileTimer);
  profileTimer=setTimeout(()=>{ profileDirty=false; persistProfile(); }, 600);
}
function normPeople(p){ p=p||{}; return { revisits:Array.isArray(p.revisits)?p.revisits:[], students:Array.isArray(p.students)?p.students:[] }; }
function persistPeople(){
  local.write();
  if(remote) enqueue('people', ()=>remote.peopleRef.set(clone(state.people)));
}
function persistMonth(key){
  local.write();
  if(remote) enqueue('m'+key, ()=>remote.monthsCol.doc(key).set(clone(state.months[key])));
}

(function loadLocal(){
  const d = local.read();
  if(d){ state.profile = Object.assign(defaultProfile(), d.profile||{}); state.months = d.months||{}; state.people = normPeople(d.people); }
})();

async function connect(){
  const sync = $('#sync');
  if(!window.claude || !window.claude.use){ sync.textContent='Dados salvos neste aparelho.'; return; }
  try{
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = user ? await user.id() : null;
    if(!db || !id){ sync.textContent='Dados salvos neste aparelho.'; return; }
    const profileRef = db.doc(`data/users/${id}/profile`);
    const monthsCol = profileRef.collection('months');
    const peopleRef = profileRef.collection('lists').doc('people');
    remote = { profileRef, monthsCol, peopleRef };
    const hadLocal = !!local.read();
    const [pSnap, mSnap, peSnap] = await Promise.all([profileRef.get(), monthsCol.get(), peopleRef.get()]);
    if(!peSnap.exists && (state.people.revisits.length || state.people.students.length)) await peopleRef.set(clone(state.people));
    if(!pSnap.exists && hadLocal && state.profile.configured){ await profileRef.set(clone(state.profile)); }
    if(mSnap.empty && Object.keys(state.months).length){
      for(const k of Object.keys(state.months)) await monthsCol.doc(k).set(clone(state.months[k]));
    }
    profileRef.onSnapshot(s=>{
      if(!s.exists || profileDirty) return;
      state.profile = Object.assign(defaultProfile(), clone(s.data()));
      local.write(); render();
    }, ()=>{});
    monthsCol.onSnapshot(s=>{
      const next={}; s.docs.forEach(d=>{ next[d.id]=Object.assign(emptyMonth(), clone(d.data())); });
      state.months = next; local.write(); render();
    }, ()=>{});
    peopleRef.onSnapshot(s=>{
      if(!s.exists) return; state.people = normPeople(clone(s.data())); local.write(); render();
    }, ()=>{});
    sync.textContent='Sincronizado na sua conta. Só você vê seus dados.';
  }catch(e){
    console.warn(e); remote=null; sync.textContent='Dados salvos neste aparelho.';
  }
}

/* ---------- calculations ---------- */
function totals(key){
  const m = month(key); let field=0, credit=0;
  m.entries.forEach(e=>{ if(e.kind==='credito') credit+=e.min; else field+=e.min; });
  return { field, credit, all: field+credit };
}
function goalMonthMin(){ return (Number(state.profile.goalMonth)||0)*60; }
function timerMs(){ const t=state.profile.timer; return t.accumMs + (t.running && t.startedAt ? Date.now()-t.startedAt : 0); }
function participated(key){ const m=month(key); return m.participated===null || m.participated===undefined ? m.entries.length>0 : !!m.participated; }

/* ---------- views ---------- */
function progressBlock(key, compact){
  const t = totals(key), goal = goalMonthMin(), type = state.profile.type;
  const hasGoal = goal>0 && type!=='publicador';
  const pct = hasGoal ? Math.min(100, t.all/goal*100) : 0;
  let facts = '';
  if(hasGoal){
    const left = Math.max(0, goal - t.all);
    let paceTxt = '—', daysTxt='—';
    const cur = curMonthKey();
    if(key===cur){
      const d=new Date(); const last=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
      const daysLeft = last - d.getDate() + 1; daysTxt = String(daysLeft);
      paceTxt = left ? fmtHM(left/daysLeft) : 'ok';
    } else if(key<cur){ daysTxt='0'; paceTxt = left ? 'encerrado':'ok'; }
    facts = `<div class="facts">
      <div class="fact"><b>${left? fmtHM(left):'Meta!'}</b><span>${left?'faltam':'alcançada'}</span></div>
      <div class="fact"><b>${daysTxt}</b><span>dias restantes</span></div>
      <div class="fact"><b>${paceTxt}</b><span>por dia p/ meta</span></div>
    </div>`;
  }
  return `
    <div class="row between">
      <div>
        <div class="eyebrow">${compact ? esc(monthName(key)) : 'Horas no mês'}</div>
        <div class="big">${fmtHM(t.all)}${hasGoal?`<small>de ${state.profile.goalMonth}h</small>`:''}</div>
      </div>
      ${t.credit ? `<span class="small muted num">${fmtHM(t.field)} campo · ${fmtHM(t.credit)} crédito</span>`:''}
    </div>
    ${hasGoal ? `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct)}"><i style="width:${pct}%"></i></div>` : `<p class="small muted" style="margin:0">Publicadores relatam só a participação e os estudos. As horas aqui ficam para seu controle.</p>`}
    ${facts}`;
}

function startEdit(id, where){
  for(const [k,m] of Object.entries(state.months)){
    const e=(m.entries||[]).find(x=>x.id===id);
    if(e){ state.editing={ id, key:k, where, date:e.date, h:String(Math.floor(e.min/60)), m:String(e.min%60), kind:e.kind||'campo', note:e.note||'', at:e.at }; state.armed=null; return true; }
  }
  return false;
}

function calendar(key){
  const [y,mo]=key.split('-').map(Number);
  const first=new Date(y,mo-1,1).getDay(), last=new Date(y,mo,0).getDate();
  const byDay={}; month(key).entries.forEach(e=>{ byDay[e.date]=(byDay[e.date]||0)+e.min; });
  const today=todayISO();
  let cells=WEEK.map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) cells+='<div class="pad"></div>';
  for(let d=1; d<=last; d++){
    const iso=`${key}-${pad(d)}`, min=byDay[iso]||0;
    const cls=['d', min?'has':'', iso===today?'today':'', iso===state.selDay?'sel':'', iso>today?'future':''].join(' ');
    const wd=WEEK_FULL[new Date(y,mo-1,d).getDay()];
    cells+=`<button class="${cls}" data-day="${iso}" aria-label="${wd}, ${d}: ${min?fmtHM(min):'sem tempo'}"><b>${d}</b>${min?`<span>${fmtHM(min)}</span>`:''}</button>`;
  }
  let detail='';
  if(state.selDay && monthKeyOf(state.selDay)===key){
    const dt=new Date(state.selDay+'T12:00:00'), min=byDay[state.selDay]||0;
    const n=month(key).entries.filter(e=>e.date===state.selDay).length;
    detail=`<div class="daydetail"><div><b>${WEEK_FULL[dt.getDay()]}, ${dt.getDate()} de ${dt.toLocaleDateString('pt-BR',{month:'long'})}</b><div class="small muted">${min?`${fmtHM(min)} em ${n} ${n===1?'lançamento':'lançamentos'}`:'Nenhum tempo lançado'}</div></div>${state.selDay<=today?`<button class="btn" data-act="addday">Lançar neste dia</button>`:''}</div>`;
    const dayEntries = month(key).entries.filter(e=>e.date===state.selDay).sort((a,b)=>(a.at||0)-(b.at||0));
    if(state.editing && state.editing.where==='cal') detail += editorHtml();
    else if(dayEntries.length) detail += `<div class="dayentries">${dayEntries.map(e=>`<div class="dayentry"><div><span class="dur num" style="font-family:var(--mono);font-weight:600">${fmtHM(e.min)}</span>${e.kind==='credito'?'<span class="tag">crédito</span>':''}${e.note?`<div class="note">${esc(e.note)}</div>`:''}</div><button class="linkbtn" data-edit="${esc(e.id)}" data-where="cal">Editar</button></div>`).join('')}</div>`;
  } else {
    detail='<p class="small muted" style="margin:0">Toque em um dia para ver o tempo e o dia da semana.</p>';
  }
  return `<div class="cal">${cells}</div>${detail}`;
}

function reportText(key){
  const p = state.profile, m = month(key), t = totals(key);
  const lines = [`Relatório de serviço de campo — ${monthName(key)}`];
  if(p.name) lines.push(`Nome: ${p.name}`);
  lines.push(`Participei no ministério: ${participated(key)?'Sim':'Não'}`);
  lines.push(`Estudos bíblicos: ${m.studies||0}`);
  if(p.type!=='publicador'){
    lines.push(`Horas: ${Math.floor(t.field/60)}${t.field%60?`  (total ${fmtHM(t.field)})`:''}`);
    if(t.credit) lines.push(`Horas de crédito: ${Math.floor(t.credit/60)}${t.credit%60?`  (total ${fmtHM(t.credit)})`:''}`);
    lines.push(`Observações: ${TYPES[p.type].label}`);
  }
  return lines.join('\n');
}

function viewAno(){
  const y = state.yearStart, cur = curMonthKey();
  const keys = Array.from({length:12},(_,i)=> addMonths(`${y}-09`, i));
  const vals = keys.map(k=>totals(k).all);
  const goal = state.profile.type==='publicador' ? 0 : goalMonthMin();
  const max = Math.max(goal, ...vals, 60);
  const sum = vals.reduce((a,b)=>a+b,0);
  const studiesAvg = (()=>{ const past=keys.filter(k=>k<=cur && state.months[k]); if(!past.length) return 0; return past.reduce((a,k)=>a+(month(k).studies||0),0)/past.length; })();
  const goalYear = Number(state.profile.goalYear)||0;
  const hasYearGoal = goalYear>0 && state.profile.type!=='publicador';
  const yPct = hasYearGoal ? Math.min(100, sum/(goalYear*60)*100) : 0;
  const reached = keys.filter(k=>goal && totals(k).all>=goal).length;
  const CH = 130; // bar area px
  const cols = keys.map((k,i)=>{
    const v=vals[i], future = k>cur;
    const h = future ? 6 : Math.max(2, v/max*CH);
    const cls = future ? 'future' : v===0 ? 'zero' : (goal && v<goal && k<cur) ? 'under' : '';
    const mi = Number(k.slice(5))-1;
    return `<div class="col" title="${esc(monthName(k))}: ${fmtHM(v)}"><span class="val">${future?'':fmtHM(v)}</span><div class="b ${cls}" style="height:${h}px"></div><span class="lbl">${MONTHS_SHORT[mi]}</span></div>`;
  }).join('');
  const goalLine = goal ? `<div class="goal-line" style="bottom:${goal/max*CH + 22}px"><span>meta ${state.profile.goalMonth}h</span></div>` : '';
  return `
  <div class="mnav">
    <button class="iconbtn" data-year="-1" aria-label="Ano de serviço anterior">‹</button>
    <div style="text-align:center"><div class="eyebrow">Ano de serviço</div><h2>set/${y} – ago/${y+1}</h2></div>
    <button class="iconbtn" data-year="1" aria-label="Próximo ano de serviço" ${y>=serviceYearStart(cur)?'disabled':''}>›</button>
  </div>
  <section class="card">
    <div class="row between">
      <div><div class="eyebrow">Total no ano</div><div class="big">${fmtHM(sum)}${hasYearGoal?`<small>de ${goalYear}h</small>`:''}</div></div>
    </div>
    ${hasYearGoal?`<div class="bar"><i style="width:${yPct}%"></i></div>`:''}
    <div class="facts">
      <div class="fact"><b>${hasYearGoal? fmtHM(Math.max(0,goalYear*60-sum)) : fmtHM(sum/Math.max(1,keys.filter(k=>k<=cur).length))}</b><span>${hasYearGoal?'faltam no ano':'média por mês'}</span></div>
      <div class="fact"><b>${goal?reached:'—'}</b><span>meses com meta</span></div>
      <div class="fact"><b>${studiesAvg.toFixed(1).replace('.',',')}</b><span>estudos/mês (média)</span></div>
    </div>
  </section>
  <section class="card">
    <h2>Horas por mês</h2>
    <div style="overflow-x:auto"><div class="chart">${goalLine}${cols}</div></div>
    ${goal?`<div class="legend"><span><i style="background:var(--accent)"></i>meta alcançada ou mês atual</span><span><i style="background:var(--amber)"></i>abaixo da meta</span></div>`:''}
  </section>`;
}

function initials(){ const n=(state.profile.name||'').trim().split(/\s+/).filter(Boolean); return n.length ? (n[0][0]+(n.length>1?n[n.length-1][0]:'')).toUpperCase() : '?'; }
function avatarInner(){ return state.profile.photo ? `<img src="${esc(state.profile.photo)}" alt="Sua foto">` : esc(initials()); }
function resizePhoto(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      const S=256, side=Math.min(img.naturalWidth,img.naturalHeight);
      const c=document.createElement('canvas'); c.width=S; c.height=S;
      c.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,S,S);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('img')); };
    img.src=url;
  });
}

const PRESETS = [
  {name:'Verde', hex:'#2F6B4F'}, {name:'Azul', hex:'#2A5C9A'}, {name:'Petróleo', hex:'#1F6F78'}, {name:'Roxo', hex:'#6A4C9C'},
  {name:'Vinho', hex:'#8E3B4F'}, {name:'Laranja', hex:'#B4561E'}, {name:'Grafite', hex:'#4A5560'},
];
const DEFAULT_ACCENT = '#2F6B4F';
const FONT_SIZES = [
  {id:'minimo', label:'Mínimo', px:12}, {id:'menor', label:'Menor', px:13},
  {id:'pequeno', label:'Pequeno', px:14}, {id:'normal', label:'Normal', px:16},
  {id:'grande', label:'Grande', px:18}, {id:'enorme', label:'Muito grande', px:20},
];
const HOST_THEME = document.documentElement.getAttribute('data-theme');
function hexToHsl(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return null;
  const n=parseInt(m[1],16); let r=(n>>16&255)/255, g=(n>>8&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b); let h=0, s=0, l=(mx+mn)/2;
  if(mx!==mn){ const d=mx-mn; s=l>.5? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d+(g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4; h*=60; }
  return {h, s:s*100, l:l*100};
}
const hsl=(h,s,l)=>`hsl(${Math.round(h)} ${Math.round(s)}% ${Math.round(l)}%)`;
function applyTheme(){
  const p=state.profile;
  const fs=(FONT_SIZES.find(f=>f.id===p.fontSize)||FONT_SIZES[1]).px;
  document.documentElement.style.fontSize = fs===16 ? '' : fs+'px';
  // light/dark mode
  const root=document.documentElement;
  if(p.mode==='light' || p.mode==='dark') root.setAttribute('data-theme', p.mode);
  else if(HOST_THEME) root.setAttribute('data-theme', HOST_THEME); else root.removeAttribute('data-theme');
  // accent
  let el=document.getElementById('userTheme');
  if(!el){ el=document.createElement('style'); el.id='userTheme'; document.head.appendChild(el); }
  const c=hexToHsl(p.accent);
  if(!c || (p.accent||'').toUpperCase()===DEFAULT_ACCENT){ el.textContent=''; }
  else {
    const L=Math.min(Math.max(c.l,24),42), S=Math.min(c.s,80);
    const light=`--accent:${hsl(c.h,S,L)};--accent-ink:#FFFFFF;--accent-soft:${hsl(c.h,Math.min(S,45),91)};`;
    const dark=`--accent:${hsl(c.h,Math.min(S,60),66)};--accent-ink:#0E1511;--accent-soft:${hsl(c.h,Math.min(S,35),19)};`;
    el.textContent=`:root{${light}}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark}}}:root[data-theme="dark"]{${dark}}`;
  }
  const meta=document.querySelector('meta[name="theme-color"]:not([media])') || document.querySelector('meta[name="theme-color"]');
  if(meta && window.__PWA__){ document.querySelectorAll('meta[name="theme-color"]').forEach(m=>m.setAttribute('content', getComputedStyle(root).getPropertyValue('--ground').trim() || '#F3F5F0')); }
}

  cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
};
const DUR_UNITS = [['dias','dias'],['semanas','semanas'],['meses','meses'],['anos','anos']];
function daysBetween(aISO, bISO){ return Math.round((new Date(bISO+'T12:00:00') - new Date(aISO+'T12:00:00'))/86400000); }
function startFromDuration(n, unit){
  const d=new Date(); d.setHours(12,0,0,0);
  if(unit==='dias') d.setDate(d.getDate()-n);
  else if(unit==='semanas') d.setDate(d.getDate()-7*n);
  else if(unit==='meses') d.setMonth(d.getMonth()-n);
  else d.setFullYear(d.getFullYear()-n);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function elapsedParts(startISO){
  const s=new Date(startISO+'T12:00:00'), t=new Date(todayISO()+'T12:00:00');
  const days=Math.max(0, Math.round((t-s)/86400000));
  let months=(t.getFullYear()-s.getFullYear())*12 + (t.getMonth()-s.getMonth()); if(t.getDate()<s.getDate()) months--;
  months=Math.max(0,months);
  return {days, months, years:Math.floor(months/12)};
}
function elapsedText(startISO){
  const {days, months} = elapsedParts(startISO);
  const pl=(n,a,b)=>`${n} ${n===1?a:b}`;
  if(days===0) return 'Começou hoje';
  if(days<14) return pl(days,'dia','dias');
  if(months<2) return pl(Math.floor(days/7),'semana','semanas');
  if(months<12) return pl(months,'mês','meses');
  const y=Math.floor(months/12), r=months%12;
  return pl(y,'ano','anos') + (r? ` e ${pl(r,'mês','meses')}`:'');
}
function durationGuess(startISO){
  const {days, months} = elapsedParts(startISO);
  if(months>=12 && months%12===0) return {n:months/12, unit:'anos'};
  if(months>=2) return {n:months, unit:'meses'};
  if(days>=14 && days%7===0) return {n:days/7, unit:'semanas'};
  return {n:days, unit:'dias'};
}
function fmtDateLong(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short', day:'numeric', month:'short'}).replace('.', ''); }
function visitPill(r){
  if(!r.nextDate) return '<span class="pill">Sem data marcada</span>';
  const d=daysBetween(todayISO(), r.nextDate);
  const t = r.nextTime ? ` · ${r.nextTime}` : '';
  if(d<0) return `<span class="pill late">Atrasada ${-d} ${d===-1?'dia':'dias'}</span>`;
  if(d===0) return `<span class="pill today">Hoje${t}</span>`;
  if(d===1) return `<span class="pill ok">Amanhã${t}</span>`;
  return `<span class="pill ok">${fmtDateLong(r.nextDate)}${t}</span>`;
}

/* ---------- actions ---------- */
function setTimer(t){ state.profile.timer = t; persistProfile(); render(); }

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ state.tab=b.dataset.tab; state.armed=null; state.editing=null; state.pform=null; render(); window.scrollTo(0,0); return; }
  if(b.dataset.go){ state.tab=b.dataset.go; render(); window.scrollTo(0,0); return; }
  if(b.dataset.kind){ state.draft.kind=b.dataset.kind; render(); return; }
  if(b.dataset.month){ state.cursor=addMonths(state.cursor, Number(b.dataset.month)); state.armed=null; state.selDay=null; state.editing=null; render(); return; }
  if(b.dataset.year){ state.yearStart+=Number(b.dataset.year); render(); return; }
  if(b.dataset.type){
    const k=b.dataset.type; state.profile.type=k; state.profile.goalMonth=TYPES[k].month; state.profile.goalYear=TYPES[k].year; state.profile.configured=true;
    persistProfile(); render(); return;
  }
  if(b.dataset.accent){ state.profile.accent = b.dataset.accent===DEFAULT_ACCENT ? '' : b.dataset.accent; persistProfile(); render(); return; }
  if(b.dataset.fsize){ state.profile.fontSize=b.dataset.fsize; persistProfile(); render(); return; }
  if(b.dataset.mode){ state.profile.mode=b.dataset.mode; persistProfile(); render(); return; }
  if(b.dataset.pview){ state.pview=b.dataset.pview; state.pform=null; state.armed=null; render(); return; }
  if(b.dataset.pedit){
    const id=b.dataset.pedit, rev=state.pview==='rev';
    const it=(rev?state.people.revisits:state.people.students).find(x=>x.id===id); if(!it) return;
    if(rev) state.pform={kind:'rev', id, name:it.name||'', pub:it.pub||'', addr:it.addr||'', nextDate:it.nextDate||'', nextTime:it.nextTime||'', notes:it.notes||''};
    else { const g=durationGuess(it.start); state.pform={kind:'est', id, name:it.name||'', pub:it.pub||'', durN:String(g.n), durU:g.unit, durTouched:false, notes:it.notes||''}; }
    state.armed=null; render(); const c=$('#pformCard'); if(c) c.scrollIntoView({block:'start',behavior:'smooth'}); return;
  }
  if(b.dataset.pdel){
    const id=b.dataset.pdel;
    if(state.armed!=='p:'+id){ state.armed='p:'+id; render(); setTimeout(()=>{ if(state.armed==='p:'+id){ state.armed=null; render(); } },4000); return; }
    state.people.revisits=state.people.revisits.filter(x=>x.id!==id); state.people.students=state.people.students.filter(x=>x.id!==id);
    state.armed=null; persistPeople(); render(); toast('Apagado'); return;
  }
  if(b.dataset.ptostudent){
    const r=state.people.revisits.find(x=>x.id===b.dataset.ptostudent); if(!r) return;
    state.people.students.push({ id:uid(), name:r.name, pub:r.pub||'', start:todayISO(), notes:[r.notes, r.addr?('Endereço: '+r.addr):''].filter(Boolean).join('\n'), createdAt:Date.now() });
    state.people.revisits=state.people.revisits.filter(x=>x.id!==r.id);
    persistPeople(); state.pview='est'; render(); toast(`${r.name} agora está em Estudantes`); return;
  }
  if(b.dataset.edit){ if(startEdit(b.dataset.edit, b.dataset.where)){ render(); const ed=$('#editor'); if(ed) ed.scrollIntoView({block:'center',behavior:'smooth'}); } return; }
  if(b.dataset.ekind){ if(state.editing){ state.editing.kind=b.dataset.ekind; render(); } return; }
  if(b.dataset.day){ state.selDay = state.selDay===b.dataset.day ? null : b.dataset.day; state.editing=null; render(); return; }
  if(b.dataset.aux){ state.profile.goalMonth=Number(b.dataset.aux); state.profile.configured=true; persistProfile(); render(); return; }
  if(b.dataset.studies){
    const key=state.cursor; const m=state.months[key]=Object.assign(emptyMonth(), state.months[key]||{});
    m.studies=Math.max(0,(m.studies||0)+Number(b.dataset.studies)); persistMonth(key); render(); return;
  }
  if(b.dataset.del){
    const id=b.dataset.del;
    if(state.armed!==id){ state.armed=id; render(); setTimeout(()=>{ if(state.armed===id){ state.armed=null; render(); } }, 4000); return; }
    const key=state.cursor; const m=state.months[key]; if(!m) return;
    m.entries=m.entries.filter(x=>x.id!==id); state.armed=null; persistMonth(key); render(); toast('Lançamento removido'); return;
  }
  const act=b.dataset.act; if(!act) return;
  const t=state.profile.timer;
  if(act==='start'){ setTimer({ running:true, startedAt:Date.now(), accumMs:t.accumMs||0 }); }
  else if(act==='pause'){ setTimer({ running:false, startedAt:null, accumMs:timerMs() }); }
  else if(act==='discard'){ setTimer({ running:false, startedAt:null, accumMs:0 }); toast('Cronômetro zerado'); }
  else if(act==='finish'){
    const min = Math.round(timerMs()/60000);
    state.draft = { date: todayISO(), h: String(Math.floor(min/60)), m: String(min%60), kind:'campo', note: state.draft.note };
    setTimer({ running:false, startedAt:null, accumMs:0 });
    const card=$('#entryCard'); if(card){ card.scrollIntoView({behavior:'smooth',block:'center'}); card.classList.add('flash'); }
    toast('Confira o tempo e toque em Salvar');
  }
  else if(act==='add'){
    readDraft();
    const min = (parseInt(state.draft.h,10)||0)*60 + (parseInt(state.draft.m,10)||0);
    if(!state.draft.date){ toast('Escolha a data do lançamento'); return; }
    if(min<=0){ toast('Informe horas ou minutos'); return; }
    if(min>24*60){ toast('Um lançamento pode ter no máximo 24 horas'); return; }
    const key=monthKeyOf(state.draft.date);
    const m=state.months[key]=Object.assign(emptyMonth(), state.months[key]||{});
    m.entries=m.entries.concat([{ id:uid(), date:state.draft.date, min, kind:state.draft.kind, note:state.draft.note.trim(), at:Date.now() }]);
    persistMonth(key);
    state.draft={ date: todayISO(), h:'', m:'', kind:'campo', note:'' };
    render(); toast(`${fmtHM(min)} lançadas em ${monthName(key)}`);
  }
  else if(act==='addday'){
    state.draft={ date: state.selDay, h:'', m:'', kind:'campo', note:'' }; state.tab='contador'; render();
    const card=$('#entryCard'); if(card){ card.scrollIntoView({block:'center'}); card.classList.add('flash'); const h=$('#fH'); if(h) h.focus({preventScroll:true}); }
  }
  else if(act==='export'){
    const data=JSON.stringify({app:'meu-ministerio', version:1, savedAt:new Date().toISOString(), profile:state.profile, months:state.months, people:state.people});
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download=`meu-ministerio-backup-${todayISO()}.json`; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Backup salvo');
  }
  else if(act==='cancelimport'){ state.pendingImport=null; render(); }
  else if(act==='doimport'){
    const d=state.pendingImport.data; state.profile=Object.assign(defaultProfile(), d.profile||{}); state.months=d.months||{}; state.people=normPeople(d.people);
    state.pendingImport=null; persistPeople(); local.write(); render(); toast('Backup restaurado');
  }
  else if(act==='pnew'){
    state.pform = state.pview==='rev' ? {kind:'rev', id:null, name:'', pub:'', addr:'', nextDate:'', nextTime:'', notes:''}
                                      : {kind:'est', id:null, name:'', pub:'', durN:'', durU:'meses', durTouched:false, notes:''};
    render(); const n=$('#pName'); if(n) n.focus();
  }
  else if(act==='pcancel'){ state.pform=null; render(); }
  else if(act==='psave'){
    const f=state.pform; if(!f) return;
    const name=(f.name||'').trim(); if(!name){ toast('Escreva o nome'); const n=$('#pName'); if(n) n.focus(); return; }
    if(f.kind==='rev'){
      const data={ name, pub:(f.pub||'').trim(), addr:(f.addr||'').trim(), nextDate:f.nextDate||'', nextTime:f.nextTime||'', notes:(f.notes||'').trim() };
      if(f.id){ const it=state.people.revisits.find(x=>x.id===f.id); Object.assign(it,data); }
      else state.people.revisits.push(Object.assign({id:uid(), createdAt:Date.now()}, data));
    } else {
      const n=parseInt(f.durN,10);
      const it=f.id ? state.people.students.find(x=>x.id===f.id) : null;
      let start = it ? it.start : todayISO();
      if(!it) start = (n>0) ? startFromDuration(n, f.durU) : todayISO();
      else if(f.durTouched) start = (n>0) ? startFromDuration(n, f.durU) : todayISO();
      const data={ name, pub:(f.pub||'').trim(), start, notes:(f.notes||'').trim() };
      if(it) Object.assign(it,data); else state.people.students.push(Object.assign({id:uid(), createdAt:Date.now()}, data));
    }
    const wasEdit=!!f.id; state.pform=null; persistPeople(); render(); toast(wasEdit?'Alterações salvas':'Salvo');
  }
  else if(act==='usestudents'){
    const key=state.cursor; const m=state.months[key]=Object.assign(emptyMonth(), state.months[key]||{});
    m.studies=state.people.students.length; persistMonth(key); render();
  }
  else if(act==='canceledit'){ state.editing=null; state.armed=null; render(); }
  else if(act==='edel'){
    const ed=state.editing; if(!ed) return;
    if(state.armed!=='ed:'+ed.id){ state.armed='ed:'+ed.id; render(); return; }
    const m=state.months[ed.key]; if(m){ m.entries=m.entries.filter(x=>x.id!==ed.id); persistMonth(ed.key); }
    state.editing=null; state.armed=null; render(); toast('Lançamento apagado');
  }
  else if(act==='saveedit'){
    const ed=state.editing; if(!ed) return;
    const min=(parseInt(ed.h,10)||0)*60+(parseInt(ed.m,10)||0);
    if(!ed.date){ toast('Escolha a data'); return; }
    if(min<=0){ toast('Informe horas ou minutos'); return; }
    if(min>24*60){ toast('Um lançamento pode ter no máximo 24 horas'); return; }
    const newKey=monthKeyOf(ed.date);
    const old=state.months[ed.key]; if(old){ old.entries=old.entries.filter(x=>x.id!==ed.id); }
    const nm=state.months[newKey]=Object.assign(emptyMonth(), state.months[newKey]||{});
    nm.entries=nm.entries.concat([{ id:ed.id, date:ed.date, min, kind:ed.kind, note:(ed.note||'').trim(), at:ed.at||Date.now() }]);
    persistMonth(ed.key); if(newKey!==ed.key) persistMonth(newKey);
    const moved = ed.where==='cal' && state.selDay!==ed.date;
    if(ed.where==='cal'){ state.cursor=newKey; state.selDay=ed.date; }
    state.editing=null; render();
    toast(moved ? `Movido para ${new Date(ed.date+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}` : 'Lançamento atualizado');
  }
  else if(act==='rmphoto'){ state.profile.photo=''; persistProfile(); render(); toast('Foto removida'); }
  else if(act==='copy'){
    const txt=reportText(state.cursor);
    const done=()=>toast('Relatório copiado');
    const fallback=()=>{ const r=document.createRange(); r.selectNodeContents($('#slip')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('Texto selecionado. Copie com o menu do aparelho'); };
    try{ navigator.clipboard.writeText(txt).then(done, fallback); }catch(err){ fallback(); }
  }
});

function readDraft(){
  const g=id=>{ const el=document.getElementById(id); return el?el.value:null; };
  if(g('fDate')!==null){ state.draft.date=g('fDate'); state.draft.h=g('fH'); state.draft.m=g('fM'); state.draft.note=g('fNote'); }
}
document.addEventListener('input', e=>{
  const id=e.target.id;
  if(['fDate','fH','fM','fNote'].includes(id)){ readDraft(); return; }
  if(state.pform && ['pName','pPub','pAddr','pDate','pTime','pNotes','pDurN','pDurU'].includes(id)){
    const f={pName:'name',pPub:'pub',pAddr:'addr',pDate:'nextDate',pTime:'nextTime',pNotes:'notes',pDurN:'durN',pDurU:'durU'}[id];
    state.pform[f]=e.target.value; if(id==='pDurN'||id==='pDurU') state.pform.durTouched=true; return;
  }
  if(state.editing && ['eDate','eH','eM','eNote'].includes(id)){ const f={eDate:'date',eH:'h',eM:'m',eNote:'note'}[id]; state.editing[f]=e.target.value; return; }
  if(id==='fName'){ state.profile.name=e.target.value.slice(0,60); state.profile.configured = state.profile.configured || !!state.profile.name; $('#hello').textContent = state.profile.name?`Olá, ${state.profile.name}`:'Ministério de campo'; if(!state.profile.photo){ const a=$('#bigAvatar'); if(a) a.textContent=initials(); $('#topAvatar').textContent=initials(); } persistProfileSoon(); }
  if(id==='fAccent'){ state.profile.accent=e.target.value.toUpperCase(); applyTheme(); persistProfileSoon(); return; }
  if(id==='fGoalM'){ state.profile.goalMonth=Math.max(0,Number(e.target.value)||0); state.profile.configured=true; persistProfileSoon(); }
  if(id==='fGoalY'){ state.profile.goalYear=Math.max(0,Number(e.target.value)||0); persistProfileSoon(); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='fImport'){
    const f=e.target.files && e.target.files[0]; if(!f) return;
    f.text().then(t=>{
      const d=JSON.parse(t); if(!d || d.app!=='meu-ministerio' || typeof d.months!=='object') throw new Error('bad');
      state.pendingImport={ data:d, count:Object.values(d.months).filter(m=>m && m.entries && m.entries.length).length }; render();
    }).catch(()=>toast('Esse arquivo não é um backup do Meu Ministério'));
    return;
  }
  if(e.target.id==='fPhoto'){
    const f=e.target.files && e.target.files[0]; if(!f) return;
    if(!/^image\//.test(f.type)){ toast('Escolha um arquivo de imagem'); return; }
    resizePhoto(f).then(data=>{ state.profile.photo=data; persistProfile(); render(); toast('Foto atualizada'); })
      .catch(()=>toast('Não consegui abrir essa imagem. Tente outra foto.'));
    return;
  }
  if(e.target.id==='fAccent'){ render(); return; }
  if(e.target.id==='pDurU' && state.pform){ state.pform.durU=e.target.value; state.pform.durTouched=true; return; }
  if(e.target.id==='fPart'){
    const key=state.cursor; const m=state.months[key]=Object.assign(emptyMonth(), state.months[key]||{});
    m.participated=e.target.checked; persistMonth(key); render();
  }
});

/* ---------- tick ---------- */
setInterval(()=>{
  if(state.tab!=='contador' || !state.profile.timer.running) return;
  const c=$('#clock'); if(c) c.textContent=fmtClock(timerMs());
}, 1000);

render();
connect();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
    .then(reg => { window.__swReg = reg; }).catch(() => {}));
}
// Confere se existe versão nova ao abrir e ao voltar para o app.
(function(){
  let checking = false;
  async function checkUpdate(){
    if (checking || !navigator.onLine) return; checking = true;
    try {
      const r = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
      const v = (await r.json()).version;
      if (v > window.__APP_VERSION__) {
        const k = 'reloaded-for-' + v;
        if (!sessionStorage.getItem(k)) {
          sessionStorage.setItem(k, '1');
          if (window.__swReg) { try { await window.__swReg.update(); } catch(e){} }
          location.reload();
          return;
        }
      }
    } catch(e) {}
    checking = false;
  }
  window.addEventListener('load', checkUpdate);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  window.addEventListener('pageshow', e => { if (e.persisted) checkUpdate(); });
})();
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
</script>
